name: CD - Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy'
        required: false
        type: string

env:
  ENVIRONMENT: staging
  RESOURCE_GROUP: rg-securecloud-staging-apps
  CONTAINER_APP_NAME: app-securecloud-staging
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_NAME: securecloud-app

jobs:
  # Job 1: Deploy Infrastructure
  deploy-infrastructure:
    name: Deploy Infrastructure (Bicep)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        run: |
          az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file ./infrastructure/main.bicep \
            --parameters @infrastructure/environments/staging/main.parameters.json \
            --parameters postgresAdminPassword=${{secrets.POSTGRES_ADMIN_PASSWORD}} \
            --name 'deploy-${{ github.sha }}'

      - name: Get deployment outputs
        id: outputs
        run: |
          OUTPUTS=$(az deployment group show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name 'deploy-${{ github.sha }}' \
            --query properties.outputs -o json)
          echo "outputs=$OUTPUTS" >> $GITHUB_OUTPUT

      - name: Set outputs as environment variables
        run: |
          echo "ACR_LOGIN_SERVER=$(echo '${{ steps.outputs.outputs }}' | jq -r '.acrLoginServer.value')" >> $GITHUB_ENV
          echo "CONTAINER_APP_FQDN=$(echo '${{ steps.outputs.outputs }}' | jq -r '.containerAppFqdn.value')" >> $GITHUB_ENV
          echo "APP_IDENTITY_CLIENT_ID=$(echo '${{ steps.outputs.outputs }}' | jq -r '.appIdentityClientId.value')" >> $GITHUB_ENV
          echo "APP_INSIGHTS_CONNECTION_STRING=$(echo '${{ steps.outputs.outputs }}' | jq -r '.appInsightsConnectionString.value')" >> $GITHUB_ENV

  # Job 2: Build & Push Container Image
  build-image:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Determine image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG="staging-${SHORT_SHA}-$(date +%s)"
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=raw,value=staging-latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan container image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: 'sarif'
          output: 'trivy-staging.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-staging.sarif
          category: trivy-staging

  # Job 3: Deploy to Container Apps
  deploy-app:
    name: Deploy to Container Apps
    needs: [deploy-infrastructure, build-image]
    runs-on: ubuntu-latest
    environment: Staging
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-image.outputs.image-tag }} \
            --set-env-vars \
              AZURE_CLIENT_ID=${{ env.APP_IDENTITY_CLIENT_ID }} \
              APPLICATIONINSIGHTS_CONNECTION_STRING=${{ env.APP_INSIGHTS_CONNECTION_STRING }} \
              KEY_VAULT_URI=$(az keyvault show --name kv-securecloud-staging --resource-group rg-securecloud-staging-networking --query properties.vaultUri -o tsv)

      - name: Wait for deployment
        run: |
          echo "Waiting for deployment to complete..."
          sleep 30

      - name: Verify deployment
        run: |
          FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          echo "Testing deployment at https://${FQDN}"

          for i in {1..10}; do
            if curl -f -s "https://${FQDN}/health" > /dev/null; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "Attempt $i/10 failed, retrying in 10s..."
            sleep 10
          done

          echo "❌ Health check failed after 10 attempts"
          exit 1

      - name: Run integration tests
        run: |
          FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          echo "Running integration tests against https://${FQDN}"

          # Health check
          curl -f "https://${FQDN}/health" | jq .

          # API docs
          curl -f "https://${FQDN}/api" | jq .

          # Database test
          curl -f "https://${FQDN}/db-test" | jq .

          # Metrics with API key
          API_KEY=$(az keyvault secret show --vault-name kv-securecloud-staging --name api-key --query value -o tsv)
          curl -f -H "X-API-Key: ${API_KEY}" "https://${FQDN}/api/metrics" | jq .

      - name: Notify deployment status
        if: always()
        run: |
          STATUS="${{ job.status }}"
          FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn \
            --output tsv 2>/dev/null || echo "unknown")

          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Staging" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${STATUS}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-image.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **FQDN**: https://${FQDN}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Actor**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

          if [ "${STATUS}" = "success" ]; then
            echo "✅ Staging deployment successful!"
          else
            echo "❌ Staging deployment failed!"
            exit 1
          fi