name: CD - Deploy to Development

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy'
        required: false
        type: string
      force_redeploy:
        description: 'Force redeploy even if image tag exists'
        required: false
        type: boolean
        default: false

defaults: { run: { shell: '/bin/bash' } }
env:
  ENVIRONMENT: dev
  RESOURCE_GROUP: rg-securecloud-dev-apps
  CONTAINER_APP_NAME: app-securecloud-dev
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_NAME: securecloud-app

jobs:
  # Job 1: Deploy Infrastructure
  deploy-infrastructure:
    name: Deploy Infrastructure (Bicep)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        run: |
          az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file ./infrastructure/main.bicep \
            --parameters @infrastructure/environments/dev/main.parameters.json \
            --name 'deploy-${{ github.sha }}'

      - name: Get deployment outputs
        id: outputs
        run: |
          OUTPUTS=$(az deployment group show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name 'deploy-${{ github.sha }}' \
            --query properties.outputs -o json)
          echo "outputs=$OUTPUTS" >> $GITHUB_OUTPUT

      - name: Set outputs as environment variables
        run: |
          ACR_LOGIN_SERVER=$(jq -r '.acrLoginServer.value' <<< ${{ steps.outputs.outputs }})
          CONTAINER_APP_FQDN=$(jq -r '.containerAppFqdn.value' <<< ${{ steps.outputs.outputs }})
          APP_IDENTITY_CLIENT_ID=$(jq -r '.appIdentityClientId.value' <<< ${{ steps.outputs.outputs }})
          GITHUB_IDENTITY_CLIENT_ID=$(jq -r '.githubIdentityClientId.value' <<< ${{ steps.outputs.outputs }})
          APP_INSIGHTS_CONNECTION_STRING=$(jq -r '.appInsightsConnectionString.value' <<< ${{ steps.outputs.outputs }})
          KEY_VAULT_URI=$(jq -r '.keyVaultUri.value' <<< ${{ steps.outputs.outputs }})
          echo "ACR_LOGIN_SERVER=${ACR_LOGIN_SERVER}" >> $GITHUB_ENV
          echo "CONTAINER_APP_FQDN=${CONTAINER_APP_FQDN}" >> $GITHUB_ENV
          echo "APP_IDENTITY_CLIENT_ID=${APP_IDENTITY_CLIENT_ID}" >> $GITHUB_ENV
          echo "GITHUB_IDENTITY_CLIENT_ID=${GITHUB_IDENTITY_CLIENT_ID}" >> $GITHUB_ENV
          echo "APP_INSIGHTS_CONNECTION_STRING=${APP_INSIGHTS_CONNECTION_STRING}" >> $GITHUB_ENV
          echo "KEY_VAULT_URI=${KEY_VAULT_URI}" >> $GITHUB_ENV

  # Job 2: Build & Push Container Image
  build-image:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Determine image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG="dev-${SHORT_SHA}-$(date +%s)"
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=raw,value=dev-latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local
          cache-to: type=local

      - name: Scan container image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: 'sarif'
          output: 'trivy-dev.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-dev.sarif
          category: trivy-dev

  # Job 3: Deploy to Container Apps
  deploy-app:
    name: Deploy to Container Apps
    needs: [deploy-infrastructure, build-image]
    runs-on: ubuntu-latest
    environment: Development
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-image.outputs.image-tag }} \
            --set-env-vars \
              AZURE_CLIENT_ID=${{ env.APP_IDENTITY_CLIENT_ID }} \
              APPLICATIONINSIGHTS_CONNECTION_STRING=${{ env.APP_INSIGHTS_CONNECTION_STRING }} \
              KEY_VAULT_URI=${{ env.KEY_VAULT_URI }}

      - name: Wait for deployment
        run: |
          echo "Waiting for deployment to complete..."
          sleep 30

      - name: Verify deployment
        run: |
          FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          echo "Testing deployment at https://${FQDN}"

          for i in {1..10}; do
            if curl -f -s "https://${FQDN}/health" > /dev/null; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "Attempt $i/10 failed, retrying in 10s..."
            sleep 10
          done

          echo "❌ Health check failed after 10 attempts"
          exit 1

      - name: Run smoke tests
        run: |
          FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          echo "Running smoke tests against https://${FQDN}"

          # Test health endpoint
          curl -f "https://${FQDN}/health" | jq .

          # Test API docs
          curl -f "https://${FQDN}/api" | jq .

          # Test database connection
          curl -f "https://${FQDN}/db-test" | jq .

      - name: Notify deployment status
        if: always()
        run: |
          STATUS="${{ job.status }}"
          FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn \
            --output tsv 2>/dev/null || echo "unknown")

          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Development" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${STATUS}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-image.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **FQDN**: https://${FQDN}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Actor**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

          if [ "${STATUS}" = "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
            exit 1
          fi